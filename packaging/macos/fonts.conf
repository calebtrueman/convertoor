<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig setup for the converters bundled in Convertoor.app -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>sans-serif</family><prefer><family>Helvetica Neue</family><family>Helvetica</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Times New Roman</family><family>Times</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Menlo</family><family>Courier</family></prefer></alias>
</fontconfig>
